<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZEN PK Game</title>
  <style>
    :root { --ink:#f4f7f2; --lime:#cbff38; --navy:#08151d; --blue:#38c8ff; --red:#ff5c58; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at 50% -15%,#184c53 0,#0b222b 35%,#050b10 75%); display:grid; place-items:center; overflow-x:hidden; }
    button { font:inherit; }
    .game { width:min(1050px,100%); padding:28px 20px 42px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:18px; }
    .eyebrow { color:var(--lime); font-weight:800; letter-spacing:.22em; font-size:.72rem; }
    h1 { margin:.12em 0 0; font-size:clamp(2rem,6vw,4.7rem); line-height:.9; letter-spacing:-.06em; }
    .scoreboard { display:flex; align-items:center; gap:15px; background:#071015cc; border:1px solid #ffffff20; padding:11px 18px; border-radius:16px; box-shadow:0 14px 40px #0006; }
    .score { text-align:center; min-width:64px; }
    .score b { display:block; font-size:2rem; line-height:1; }
    .score small { color:#aab8bc; }
    .divider { color:#617079; font-size:1.4rem; }
    .pitch { position:relative; aspect-ratio:16/9; min-height:390px; border-radius:24px; overflow:hidden; background:linear-gradient(#7bc8de 0 26%,#4e9947 26% 38%,#22783c 38% 100%); box-shadow:0 35px 80px #0009, inset 0 0 0 1px #fff4; isolation:isolate; }
    .pitch::before { content:""; position:absolute; inset:38% 0 0; background:repeating-linear-gradient(90deg,#ffffff08 0 90px,#00000008 90px 180px); transform:perspective(500px) rotateX(16deg); }
    .crowd { position:absolute; inset:22% 0 auto; height:17%; background:linear-gradient(#182329,#10181d); border-top:6px solid #e6eef0; box-shadow:0 7px 0 #15272c; }
    .crowd::after { content:"●  ● ●  ● ● ●  ●  ● ●  ● ● ●  ● ●  ●  ● ● ●  ● ●"; color:#91a3a8; opacity:.65; position:absolute; inset:10px; font-size:14px; letter-spacing:10px; overflow:hidden; }
    .goal { position:absolute; left:50%; top:29%; width:52%; height:38%; transform:translateX(-50%); border:8px solid #f5f7ee; border-bottom-width:10px; background:repeating-linear-gradient(0deg,#ffffff27 0 2px,transparent 2px 30px),repeating-linear-gradient(90deg,#ffffff27 0 2px,transparent 2px 45px),#09202d52; box-shadow:0 8px 15px #0008; }
    .targets { position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); }
    .target { border:0; background:transparent; color:#fff0; cursor:pointer; transition:.15s; }
    .target:hover,.target.active,.target.shot { background:#cbff3830; box-shadow:inset 0 0 0 3px var(--lime); color:var(--lime); }
    .target.shot span { background:var(--lime); color:#08151d; transform:scale(1.2); }
    .target span { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:8px; background:#071015aa; font-weight:900; }
    .keeper { position:absolute; left:50%; top:49%; width:75px; height:95px; transform:translate(-50%,-50%); transition:left .42s cubic-bezier(.2,.9,.2,1),top .42s cubic-bezier(.2,.9,.2,1),transform .42s; z-index:4; }
    .keeper::before { content:""; position:absolute; left:26px; top:0; width:25px; height:25px; border-radius:50%; background:#d99b73; box-shadow:0 23px 0 11px #ff5c58, -21px 31px 0 -7px #ff5c58, 21px 31px 0 -7px #ff5c58, -10px 66px 0 -6px #19222d, 11px 66px 0 -6px #19222d; }
    .keeper.save-left { transform:translate(-50%,-50%) rotate(-22deg) scale(.72); }
    .keeper.save-right { transform:translate(-50%,-50%) rotate(22deg) scale(.72); }
    .keeper.save-center { transform:translate(-50%,-50%) scale(.72); }
    .ball { position:absolute; left:50%; top:83%; width:39px; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff 0 25%,#222 27% 38%,#eee 40% 62%,#222 64% 72%,#eee 74%); transform:translate(-50%,-50%); z-index:8; filter:drop-shadow(0 12px 8px #0008); transition:.55s cubic-bezier(.2,.75,.15,1); }
    .ball.hidden { opacity:.15; }
    .spot { position:absolute; left:50%; top:88%; width:10px; height:5px; border-radius:50%; background:#e7eee4; transform:translateX(-50%); }
    .message { position:absolute; left:50%; top:13%; transform:translateX(-50%) scale(.8); opacity:0; z-index:10; font-size:clamp(2.4rem,8vw,6rem); font-weight:1000; letter-spacing:-.06em; text-shadow:0 5px 0 #0009; pointer-events:none; transition:.2s; white-space:nowrap; }
    .message.show { opacity:1; transform:translateX(-50%) scale(1); }
    .message.goal-text { color:var(--lime); }.message.save-text { color:var(--blue); }.message.miss-text { color:var(--red); }
    .panel { margin-top:16px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; }
    #status { font-size:1rem; color:#d8e3e5; }.keys { display:grid; grid-template-columns:repeat(3,42px); gap:5px; }
    .key { border:1px solid #ffffff30; background:#101e25; color:#eaf2f0; height:34px; border-radius:7px; font-weight:800; cursor:pointer; box-shadow:0 3px 0 #020609; }
    .key:hover { color:var(--lime); border-color:var(--lime); }.key:active { transform:translateY(2px); box-shadow:0 1px 0 #020609; }
    .shots { justify-self:end; text-align:right; }.dots { display:flex; justify-content:flex-end; gap:7px; margin-top:7px; }
    .dot { width:12px; height:12px; border-radius:50%; background:#334147; }.dot.goal-dot { background:var(--lime); }.dot.fail-dot { background:var(--red); }
    .restart { border:1px solid var(--lime); color:var(--navy); background:var(--lime); padding:10px 16px; border-radius:999px; font-weight:900; cursor:pointer; display:none; }
    .restart.show { display:inline-block; }
    @media(max-width:680px){ header{align-items:flex-start}.scoreboard{padding:9px}.panel{grid-template-columns:1fr auto}.shots{display:none}.pitch{min-height:360px}.goal{width:78%;height:40%} }
  </style>
</head>
<body>
  <main class="game">
    <header><div><div class="eyebrow">2026夏 · WEBコンテスト</div><h1>ZEN<br>PK GAME</h1></div><div class="scoreboard"><div class="score"><b id="playerScore">0</b><small>YOU</small></div><span class="divider">—</span><div class="score"><b id="cpuScore">0</b><small>GK</small></div></div></header>
    <section class="pitch" id="pitch" aria-label="サッカーゴール">
      <div class="crowd"></div>
      <div class="goal" id="goal"><div class="targets" id="targets"></div></div>
      <div class="keeper" id="keeper"></div><div class="ball" id="ball"></div><div class="spot"></div>
      <div class="message" id="message"></div>
    </section>
    <section class="panel">
      <div><div id="status">テンキー 1〜9 でコースを狙え</div><button class="restart" id="restart">もう一度プレイ</button></div>
      <div class="keys" id="keys" aria-label="シュート方向"></div>
      <div class="shots"><strong>SHOTS</strong><div class="dots" id="dots"></div></div>
    </section>
  </main>
  <script>
    const map = {
      7:[12,15],8:[50,15],9:[88,15],
      4:[12,50],5:[50,50],6:[88,50],
      1:[12,85],2:[50,85],3:[88,85]
    };
    const game = { round:0, goals:0, keeper:0, locked:false, over:false, results:[] };
    const $ = id => document.getElementById(id);
    const ball=$('ball'), keeper=$('keeper'), message=$('message'), status=$('status');

    for (const n of [7,8,9,4,5,6,1,2,3]) {
      const target=document.createElement('button'); target.className='target'; target.dataset.key=n; target.innerHTML=`<span>${n}</span>`; target.onclick=()=>shoot(n); $('targets').append(target);
      const key=document.createElement('button'); key.className='key'; key.textContent=n; key.onclick=()=>shoot(n); $('keys').append(key);
    }
    document.addEventListener('keydown',e=>{ const n=Number(e.key); if(map[n]) shoot(n); });
    $('restart').onclick=reset;

    function shoot(n){
      if(game.locked||game.over) return;
      game.locked=true;
      document.querySelector(`[data-key="${n}"]`).classList.add('shot');
      status.textContent=`コース ${n} へシュート！`;
      const [x,y]=goalPoint(n), keeperPick=Math.ceil(Math.random()*9);
      const [keeperX,keeperY]=goalPoint(keeperPick);
      const saved=keeperPick===n;
      keeper.className='keeper '+(map[keeperPick][0]<40?'save-left':map[keeperPick][0]>60?'save-right':'save-center');
      keeper.style.left=keeperX+'%';
      keeper.style.top=keeperY+'%';
      ball.style.left=x+'%'; ball.style.top=(y*0.38+29)+'%'; ball.style.transform='translate(-50%,-50%) scale(.58) rotate(420deg)';
      setTimeout(()=>finishShot(saved),570);
    }
    function goalPoint(n){
      const [localX,localY]=map[n];
      const pitchRect=$('pitch').getBoundingClientRect();
      const goalRect=$('goal').getBoundingClientRect();
      return [
        ((goalRect.left-pitchRect.left+goalRect.width*localX/100)/pitchRect.width)*100,
        ((goalRect.top-pitchRect.top+goalRect.height*localY/100)/pitchRect.height)*100
      ];
    }
    function finishShot(saved){
      game.round++;
      if(saved){ game.keeper++; game.results.push(false); announce('SAVED!','save-text'); }
      else { game.goals++; game.results.push(true); announce('GOAL!','goal-text'); }
      renderScore();
      const remaining=Math.max(0,5-game.round);
      const decidedEarly=game.round<5 && (game.goals>game.keeper+remaining || game.keeper>game.goals+remaining);
      const decidedAfterFive=game.round>=5 && game.goals!==game.keeper;
      if(decidedEarly || decidedAfterFive){ endGame(); }
      else setTimeout(nextShot,1250);
    }
    function announce(text,cls){ message.textContent=text; message.className='message show '+cls; }
    function renderScore(){ $('playerScore').textContent=game.goals; $('cpuScore').textContent=game.keeper; $('dots').innerHTML=game.results.map(ok=>`<i class="dot ${ok?'goal-dot':'fail-dot'}"></i>`).join(''); }
    function nextShot(){ message.className='message'; keeper.className='keeper'; keeper.removeAttribute('style'); ball.removeAttribute('style'); document.querySelectorAll('.target.shot').forEach(el=>el.classList.remove('shot')); game.locked=false; status.textContent=game.round>=5?'サドンデス：テンキーでコースを選択':`第 ${game.round+1} キック：テンキーでコースを選択`; }
    function endGame(){
      game.over=true;
      const win=game.goals>game.keeper;
      status.textContent=win?'勝利！冷静なフィニッシュでした。':'惜しい！コースを変えて再挑戦しよう。';
      message.textContent=win?'YOU WIN':'GAME OVER'; message.className='message show '+(win?'goal-text':'miss-text'); $('restart').classList.add('show');
    }
    function reset(){ Object.assign(game,{round:0,goals:0,keeper:0,locked:false,over:false,results:[]}); $('restart').classList.remove('show'); renderScore(); nextShot(); status.textContent='テンキー 1〜9 でコースを狙え'; }
  </script>
</body>
</html>
